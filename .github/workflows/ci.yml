name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile check all Python files
        run: python3 -c "import compileall, sys; sys.exit(0 if compileall.compile_dir('.', quiet=1) else 1)"

      - name: Run tests
        run: python3 -m unittest discover -s tests -v
